<script>

const fechaBoda = new Date("2026-10-24T15:00:00");

function actualizarContador(){

const ahora = new Date();

const diferencia = fechaBoda - ahora;

const dias = Math.floor(diferencia/(1000*60*60*24));

const horas = Math.floor(
(diferencia%(1000*60*60*24))
/
(1000*60*60)
);

document.getElementById("contador").innerHTML =
`Faltan ${dias} días y ${horas} horas`;

}

setInterval(actualizarContador,1000);

actualizarContador();

async function confirmarAsistencia() {

const nombre =
document.getElementById("nombre").value;

const telefono =
document.getElementById("telefono").value;

const asistentes =
document.getElementById("asistentes").value;

if(!nombre || !telefono){

document.getElementById("resultado").innerHTML =
"Por favor completa todos los campos.";

return;

}

try{

const respuesta = await fetch(
"https://script.google.com/macros/s/AKfycbyrncpjT2mJAu1JnUWVftcoSv689PX7CStFDli3RFVojBBHFQV6qwZJvQE1JZg-amxS/exec",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
nombre:nombre,
telefono:telefono,
asistentes:asistentes
})
}
);

const data = await respuesta.json();

document.getElementById("resultado").innerHTML =
data.mensaje;

}
catch(error){

document.getElementById("resultado").innerHTML =
"Error al enviar la confirmación.";

console.error(error);

}

}

</script>
